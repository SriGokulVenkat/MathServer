<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Area of a Rectangle</title>
  <style>
    body {
      background-color: red;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: blue;
      padding: 30px;
      border: 3px dashed green;
      border-radius: 10px;
      text-align: left;
      width: 300px;
    }

    h2 {
      text-align: center;
      color: pink;
    }

    label {
      display: inline-block;
      width: 70px;
    }

    input[type="number"], input[type="text"] {
      width: 100px;
      padding: 3px;
    }

    .row {
      margin: 10px 0;
    }

    .unit {
      margin-left: 5px;
    }

    button {
      padding: 5px 10px;
      margin-left: 75px;
      margin-top: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Area of a Rectangle</h2>
    <div class="row">
      <label for="length">Length:</label>
      <input type="number" id="length" value="10">
      <span class="unit">(in m)</span>
    </div>
    <div class="row">
      <label for="breadth">Breadth:</label>
      <input type="number" id="breadth" value="15">
      <span class="unit">(in m)</span>
    </div>
    <div class="row">
      <button onclick="calculateArea()">Calculate</button>
    </div>
    <div class="row">
      <label for="area">Area:</label>
      <input type="text" id="area" readonly value="150">
      <span class="unit">m²</span>
    </div>
  </div>

  <script>
    function calculateArea() {
      const length = parseFloat(document.getElementById('length').value);
      const breadth = parseFloat(document.getElementById('breadth').value);
      const area = length * breadth;
      document.getElementById('area').value = area;
    }
  </script>
</body>
</html>
